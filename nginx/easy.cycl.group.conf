# Nginx host config for easy.cycl.group
# Certbot adds SSL directives automatically after: certbot --nginx -d easy.cycl.group

server {
    listen 80;
    listen [::]:80;
    server_name easy.cycl.group;
    # Certbot will replace this block with an HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name easy.cycl.group;

    # Certbot manages these certificate paths:
    # ssl_certificate     /etc/letsencrypt/live/easy.cycl.group/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/easy.cycl.group/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Frontend (React SPA via Docker console container)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API (NestJS – already proxied via console nginx for /api/, but direct fallback)
    location /api/ {
        proxy_pass         http://127.0.0.1:6276;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Upload size for API
    client_max_body_size 50M;
}
